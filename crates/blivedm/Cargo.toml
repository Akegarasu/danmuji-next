[package]
name = "blivedm-rs"
version = "0.1.0"
edition = "2021"
description = "Bilibili live room WebSocket client, protocol codec, event parser, and HTTP APIs"
repository = "https://github.com/Akegarasu/danmuji-next"
readme = "README.md"
keywords = ["bilibili", "danmaku", "live", "websocket"]
categories = ["api-bindings", "network-programming"]
# The repository does not currently declare a license. Keep publishing disabled
# until a LICENSE file and the matching `license`/`license-file` field are added.
publish = false

[lib]
name = "blivedm"

[dependencies]
base64 = "0.22"
brotli = "7"
flate2 = "1"
futures-util = "0.3"
log = "0.4"
md5 = "0.7"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
url = "2"
urlencoding = "2"

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
